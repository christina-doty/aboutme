title: DataEval
subtitle: An open source python library for evaluating training datasets
body: >
  I'm part of the team developing DataEval with the goal of providing data scientists
  with an easy to use toolkit for quickly surfacing issues with training data including
  biases, outliers, labeling errors, and incomplete concept coverage. My role centers 
  on adapting our existing image-centric tools to video data.
